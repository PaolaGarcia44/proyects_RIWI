name: Publicar dos ramas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: sitio/main

      - uses: actions/checkout@v4
        with:
          ref: Portafolio
          path: sitio/Portafolio

      - run: rm -rf sitio/main/.git sitio/Portafolio/.git sitio/*/node_modules

      - name: Crear menú de inicio
        run: |
          cat > sitio/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Mis proyectos</title>
          </head>
          <body>
            <h1>Mis proyectos</h1>
            <p><a href="main/">Rueda Libre</a></p>
            <p><a href="Portafolio/">Portafolio</a></p>
          </body>
          </html>
          EOF

      - run: du -sh sitio/*/* | sort -h | tail -10

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: deployment
        uses: actions/deploy-pages@v4
