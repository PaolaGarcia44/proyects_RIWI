    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <header></header>

    <body>
        <main>
            <fieldset>
                
                <legend><strong>Formulario de reserva</strong></legend>
                <center>
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required><br><br>
                <label for="documento">Número de documento:</label>
                <input type="int" id="documento" name="documento" required><br><br>
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required><br><br>
                <label for="celular">Celular:</label>
                <input type="int" id="celular" name="celular" required><br><br>
                
                </center>
            </fieldset>
            <fieldset>
                <legend><strong>Datos adicionales</strong></legend>
                <center>
                <label for="fecha">Fecha de alquiler:</label>
                <input type="date" id="fecha" name="fecha" required><br><br>

                <label for="tipo">Tipo de bicicleta:</label>
                <input type="text" id="tipo" name="tipo" required><br><br>

                <label for="Plan">Plan:</label>
                <select id=""Plan" label="Plan" required>
                <option value="">Seleccione un plan</option>
                <option value="Plan1">1 Hora</option>
                <option value="Plan2">Medio día</option>
                <option value="Plan3">Día completo</option>
                </select><br><br>

                <label for="cantidad"> cantidad de bicicletas</label>
                <input type:"number" id="cantidad" name="cantidad" required><br><br>


                <label for="recorrido-guiado">Recorrido guido:</label>
                <input type="text" id="recorrido-guiado" name="recorridoguiado" required><br><br>

                </center>
            </fieldset>
            <fieldset>
                <legend><strong>Comentarios</strong></legend>
                <center></center>
                <br>
                    <br>
                <label for="comentarios">Comentarios adicionales:</label>
                <textarea id="comentarios" name="comentarios" rows="4" cols="80"></textarea><br><br>
            
            
                <article>
                    <section><label for="politicas">Aceptación de las políticas:</label></section>
                            <input type="radio" id="politicas" name="politicas" required><br><br>
                </article>
                </center>
    </fieldset>
        </main>
    
            <section></section>
                <section></section>
        
        <footer></footer>
    </body>
    </html>
